<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: #fff; border-radius: 24px; padding: 48px 40px; width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
  }
  .login-card h1 { font-size: 28px; text-align: center; margin-bottom: 8px; color: #1e293b; }
  .login-card .subtitle { font-size: 14px; text-align: center; color: #64748b; margin-bottom: 32px; }
  .role-select {
    display: flex; gap: 16px; margin-bottom: 24px;
  }
  .role-option {
    flex: 1; cursor: pointer; padding: 20px; border: 3px solid #e2e8f0;
    border-radius: 16px; text-align: center; transition: all .2s; background: #f8fafc;
  }
  .role-option:hover { border-color: #cbd5e1; transform: translateY(-2px); }
  .role-option.selected { border-color: #667eea; background: #eef2ff; }
  .role-avatar {
    width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 12px;
    display: flex; align-items: center; justify-content: center; font-size: 32px;
  }
  .role-option.admin .role-avatar { background: linear-gradient(135deg, #1e40af, #3b82f6); color: #fff; }
  .role-option.organizer .role-avatar { background: linear-gradient(135deg, #047857, #10b981); color: #fff; }
  .role-name { font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 4px; }
  .role-desc { font-size: 12px; color: #64748b; }
  .form-group { margin-bottom: 24px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: #475469; margin-bottom: 8px; }
  .form-group input {
    width: 100%; padding: 14px 18px; border: 2px solid #e2e8f0; border-radius: 12px;
    font-size: 16px; outline: none; transition: border-color .2s;
  }
  .form-group input:focus { border-color: #667eea; }
  .btn {
    width: 100%; padding: 16px; background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; border: none; border-radius: 16px; font-size: 18px; font-weight: 700;
    cursor: pointer; transition: all .2s;
  }
  .btn:hover { opacity: .9; transform: translateY(-1px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .error { color: #ef4444; font-size: 14px; text-align: center; margin-top: 16px; display: none; }
</style>
</head>
<body>
<div class="login-card">
  <h1>座位管理后台</h1>
  <p class="subtitle">请选择角色并输入密码登录</p>
  
  <div class="role-select">
    <div class="role-option admin selected" onclick="selectRole('admin')">
      <div class="role-avatar">👤</div>
      <div class="role-name">管理员</div>
      <div class="role-desc">完整权限</div>
    </div>
    <div class="role-option organizer" onclick="selectRole('organizer')">
      <div class="role-avatar">👥</div>
      <div class="role-name">会议主办方</div>
      <div class="role-desc">座位编排</div>
    </div>
  </div>
  
  <div class="form-group">
    <label>登录密码</label>
    <input type="password" id="password" placeholder="请输入密码" autofocus
           onkeydown="if(event.key==='Enter')doLogin()">
  </div>
  <button class="btn" id="loginBtn" onclick="doLogin()">登 录</button>
  <div class="error" id="errorMsg"></div>
</div>
<script>
var selectedRole = 'admin';

// 如果已登录，直接跳转
if (localStorage.getItem('adminToken')) {
  checkToken();
}

async function checkToken() {
  try {
    var res = await fetch('/api/data', {
      headers: { 'X-Auth-Token': localStorage.getItem('adminToken') }
    });
    if (res.ok) window.location.href = '/admin.html';
  } catch (e) {}
}

function selectRole(role) {
  selectedRole = role;
  document.querySelectorAll('.role-option').forEach(function(el) {
    el.classList.remove('selected');
  });
  document.querySelector('.role-option.' + role).classList.add('selected');
  document.getElementById('password').focus();
}

async function doLogin() {
  var pwd = document.getElementById('password').value.trim();
  if (!pwd) return;
  var btn = document.getElementById('loginBtn');
  var errEl = document.getElementById('errorMsg');
  btn.disabled = true;
  errEl.style.display = 'none';

  try {
    var res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd, role: selectedRole })
    });
    var data = await res.json();
    if (data.ok) {
      localStorage.setItem('adminToken', data.token);
      localStorage.setItem('userRole', data.role);
      window.location.href = '/admin.html';
    } else {
      errEl.textContent = data.error || '密码错误';
      errEl.style.display = 'block';
    }
  } catch (e) {
    errEl.textContent = '网络错误，请重试';
    errEl.style.display = 'block';
  }
  btn.disabled = false;
}
</script>
</body>
</html>
