<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title id="pageTitle">座位查询</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #1a56db; --primary-light: #3b82f6; --primary-dark: #1e40af;
    --accent: #f59e0b; --bg: #f0f4ff; --card-bg: #fff;
    --text: #1e293b; --text2: #64748b; --border: #e2e8f0; --success: #10b981;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }

  .header {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);
    color: #fff; padding: 28px 20px 24px; text-align: center; position: relative; overflow: hidden;
  }
  .header::before {
    content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 60%);
    animation: spin 20s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: 2px; position: relative; z-index: 1; }
  .header p { font-size: 13px; opacity: .85; margin-top: 6px; position: relative; z-index: 1; }

  .search-section { padding: 20px; max-width: 520px; margin: 0 auto; }
  .search-box {
    background: var(--card-bg); border-radius: 16px; padding: 24px;
    box-shadow: 0 4px 24px rgba(0,0,0,.08); margin-top: -20px; position: relative; z-index: 2;
  }
  .search-box label { font-size: 15px; font-weight: 600; display: block; margin-bottom: 12px; }
  .input-wrapper { position: relative; }
  .input-wrapper input {
    width: 100%; padding: 14px 50px 14px 16px; border: 2px solid var(--border);
    border-radius: 12px; font-size: 16px; outline: none; transition: border-color .2s; background: #f8fafc;
  }
  .input-wrapper input:focus { border-color: var(--primary); background: #fff; }
  .search-btn {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 40px; height: 40px; border: none; background: var(--primary); color: #fff;
    border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .search-btn:hover { background: var(--primary-dark); }
  .search-btn svg { width: 20px; height: 20px; }

  #resultArea { padding: 0 20px 20px; max-width: 800px; margin: 0 auto; }

  .result-card {
    background: var(--card-bg); border-radius: 16px; padding: 20px;
    box-shadow: 0 4px 24px rgba(0,0,0,.08); margin-top: 16px; animation: slideUp .3s ease;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .result-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .result-icon {
    width: 48px; height: 48px; background: linear-gradient(135deg, var(--success), #059669);
    border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .result-icon svg { width: 24px; height: 24px; color: #fff; }
  .result-info h3 { font-size: 18px; font-weight: 700; }
  .result-info p { font-size: 13px; color: var(--text2); margin-top: 2px; }

  .seat-detail { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .seat-detail-item { background: #f1f5f9; border-radius: 10px; padding: 12px 8px; text-align: center; }
  .seat-detail-item .label { font-size: 11px; color: var(--text2); margin-bottom: 2px; }
  .seat-detail-item .value { font-size: 18px; font-weight: 700; color: var(--primary); }
  .seat-detail-item .value-en { font-size: 12px; color: var(--text2); font-weight: 400; margin-top: 2px; }
  .name-cn { font-size: 18px; font-weight: 700; }
  .name-en { font-size: 13px; color: var(--text2); font-weight: 400; margin-top: 2px; }
  .multi-name-cn { font-weight: 600; font-size: 15px; }
  .multi-name-en { font-size: 11px; color: var(--text2); margin-top: 1px; }
  .header-en { font-size: 14px; opacity: .8; margin-top: 4px; position: relative; z-index: 1; }
  .venue-badge {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: #fff; border-radius: 8px; padding: 8px 12px; margin-bottom: 16px;
    font-size: 13px; font-weight: 600; text-align: center;
  }

  /* 座位图 - 全貌自适应 */
  .seat-map-wrap { margin-top: 16px; }
  .seat-map-title {
    font-size: 14px; font-weight: 600; margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .stage {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: #fff; text-align: center; padding: 8px; border-radius: 6px 6px 24px 24px;
    font-size: 12px; font-weight: 600; letter-spacing: 4px; margin-bottom: 10px;
  }
  .seat-map { padding-bottom: 8px; }
  .seat-row { display: flex; align-items: center; justify-content: center; margin-bottom: 2px; }
  .row-label { font-size: 9px; color: var(--text2); text-align: right; flex-shrink: 0; font-weight: 600; padding-right: 3px; white-space: nowrap; }
  .seat {
    border-radius: 2px 2px 4px 4px; background: #dde3ed;
    display: flex; align-items: center; justify-content: center;
    color: transparent; flex-shrink: 0; position: relative; transition: all .3s;
  }
  .seat.highlight {
    background: var(--accent); color: #fff; font-weight: 700;
    transform: scale(1.6); z-index: 5;
    box-shadow: 0 0 0 2px rgba(245,158,11,.4), 0 2px 8px rgba(245,158,11,.5);
    animation: pulse 1.5s ease infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 2px rgba(245,158,11,.4), 0 2px 8px rgba(245,158,11,.5); }
    50% { box-shadow: 0 0 0 4px rgba(245,158,11,.2), 0 2px 12px rgba(245,158,11,.6); }
  }
  .seat-aisle { flex-shrink: 0; }
  .legend { display: flex; gap: 16px; justify-content: center; margin-top: 10px; font-size: 11px; color: var(--text2); }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }

  /* U型会场布局 */
  .u-shape-body { display: flex; align-items: stretch; justify-content: center; gap: 8px; }
  .u-shape-arm { display: flex; flex-direction: row; align-items: stretch; gap: 2px; }
  .u-shape-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .u-shape-col-label { font-size: 9px; color: var(--text2); font-weight: 600; margin-bottom: 2px; white-space: nowrap; }
  .u-shape-center { display: flex; align-items: center; justify-content: center; }
  .u-shape-bottom { display: flex; align-items: center; justify-content: center; gap: 2px; margin-top: 2px; }
  .u-shape-bottom-label { font-size: 9px; color: var(--text2); font-weight: 600; margin-right: 4px; white-space: nowrap; }

  /* 重名提示 */
  .dup-notice {
    background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px;
    padding: 10px 14px; margin-bottom: 14px; font-size: 13px; color: #92400e;
    display: flex; align-items: center; gap: 8px;
  }
  .dup-notice svg { width: 18px; height: 18px; flex-shrink: 0; color: #f59e0b; }

  .multi-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; background: var(--card-bg); border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06); margin-bottom: 10px;
    cursor: pointer; transition: all .2s; border: 2px solid transparent; animation: slideUp .3s ease;
  }
  .multi-item:hover, .multi-item.active { border-color: var(--primary); transform: translateX(4px); }
  .multi-item .left { display: flex; align-items: center; gap: 12px; }
  .multi-item .avatar {
    width: 40px; height: 40px; border-radius: 10px;
    background: linear-gradient(135deg, var(--primary-light), var(--primary));
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700;
  }
  .multi-item .name { font-weight: 600; font-size: 15px; }
  .multi-item .sub { font-size: 12px; color: var(--text2); }
  .multi-item .badge { background: #f1f5f9; border-radius: 8px; padding: 6px 10px; font-weight: 700; color: var(--primary); font-size: 12px; text-align: center; line-height: 1.3; }

  .no-result { text-align: center; padding: 32px 20px; color: var(--text2); }
  .no-result svg { width: 48px; height: 48px; color: #cbd5e1; margin-bottom: 12px; }
  .tip { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 13px; line-height: 1.8; }
  .tip svg { width: 64px; height: 64px; color: #cbd5e1; margin-bottom: 12px; }
  .tip-en { display: block; color: #94a3b8; font-size: 11px; margin-top: 4px; }
  .sub-en { display: block; color: #94a3b8; font-size: 12px; font-weight: 400; margin-top: 2px; }
  .footer { text-align: center; padding: 20px; color: var(--text2); font-size: 11px; }
</style>
</head>
<body>
<div class="header">
  <h1 id="siteTitle">数据创新发展大会</h1>
  <p class="header-en" id="siteTitleEn" style="display:none"></p>
  <p id="siteSubtitle">座位查询系统</p>
  <p class="header-en" id="siteSubtitleEn" style="display:none"></p>
</div>

<div class="search-section">
  <div class="search-box">
    <label>请输入您的姓名查询座位<span class="sub-en">Enter your name to find your seat</span></label>
    <div class="input-wrapper">
      <input type="text" id="nameInput" placeholder="请输入姓名... / Enter name..." autocomplete="off" autofocus>
      <button class="search-btn" onclick="doSearch()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<div id="resultArea">
  <div class="tip">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
    </svg>
    <p>输入您的姓名<br>即可快速定位您的座位<span class="tip-en">Enter your name<br>to quickly locate your seat</span></p>
  </div>
</div>

<div class="footer">copyright@zhongyingfang</div>

<script>
// 加载系统标题
async function loadSiteConfig() {
  try {
    var res = await fetch('/api/site-config');
    var data = await res.json();
    document.getElementById('siteTitle').textContent = data.siteTitle;
    document.getElementById('siteSubtitle').textContent = data.siteSubtitle;
    document.title = data.siteTitle + ' - ' + data.siteSubtitle;
    if (data.siteTitleEn) {
      document.getElementById('siteTitleEn').textContent = data.siteTitleEn;
      document.getElementById('siteTitleEn').style.display = '';
    }
    if (data.siteSubtitleEn) {
      document.getElementById('siteSubtitleEn').textContent = data.siteSubtitleEn;
      document.getElementById('siteSubtitleEn').style.display = '';
    }
  } catch (e) {}
}
loadSiteConfig();

var nameInput = document.getElementById('nameInput');
var resultArea = document.getElementById('resultArea');
var currentResults = null;
var lastSearchIsEn = false;
var TIP_HTML = '<div class="tip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><p>输入您的姓名<br>即可快速定位您的座位</p></div>';

// 防抖定时器：只在用户停止输入后才记录查询统计
var searchDebounceTimer = null;
var lastSearchedName = '';

nameInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    clearTimeout(searchDebounceTimer);
    doSearch();
  }
});

nameInput.addEventListener('input', function() {
  var name = this.value.trim();
  if (name.length < 1) {
    clearTimeout(searchDebounceTimer);
    resultArea.innerHTML = TIP_HTML;
    return;
  }

  // 至少2个字符才开始匹配，避免单字匹配过多结果
  if (name.replace(/\s/g, '').length < 2) {
    clearTimeout(searchDebounceTimer);
    resultArea.innerHTML = '<div class="tip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg><p>请输入至少2个字<br><span style="font-size:12px;color:#94a3b8">Please enter at least 2 characters</span></p></div>';
    return;
  }

  // 实时显示搜索结果（不记录统计）
  performSearch(name, false);
  
  // 防抖：用户停止输入 800ms 后才记录到查询统计
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(function() {
    performSearch(name, true);
  }, 800);
});

// 执行搜索，trackStats 控制是否记录到查询统计
async function performSearch(name, trackStats) {
  if (!name) return;
  lastSearchIsEn = /^[a-zA-Z\s]+$/.test(name.trim());
  try {
    var url = '/api/search?name=' + encodeURIComponent(name);
    if (trackStats) url += '&track=1';
    var res = await fetch(url);
    var data = await res.json();
    currentResults = data.results;
    if (data.results.length === 0) showNoResult(name);
    else if (data.results.length === 1) showResult(data.results[0], false, lastSearchIsEn);
    else showMulti(data.results, lastSearchIsEn);
  } catch(e) { resultArea.innerHTML = '<div class="no-result"><p>查询失败，请重试</p></div>'; }
}

async function doSearch() {
  var name = nameInput.value.trim();
  if (!name) return;
  // 直接搜索，不记录统计（由防抖处理）
  await performSearch(name, false);
}

function showNoResult(name) {
  resultArea.innerHTML = '<div class="result-card"><div class="no-result">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
    '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>' +
    '<p>未找到「' + esc(name) + '」的座位信息</p>' +
    '<p style="margin-top:8px;font-size:12px;color:#94a3b8">请确认姓名是否正确，或联系工作人员</p></div></div>';
}

function showResult(person, hasDup, isEnSearch) {
  resultArea.innerHTML = renderPersonCard(person, hasDup, isEnSearch);
}

function showMulti(results, isEnSearch) {
  var nameCount = {};
  results.forEach(function(p) { nameCount[p.name] = (nameCount[p.name] || 0) + 1; });
  var hasDup = Object.values(nameCount).some(function(c) { return c > 1; });

  var html = '<div style="margin-top:16px">';
  if (hasDup) {
    html += '<div class="dup-notice">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>' +
      '<line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' +
      '存在同名参会者，请根据<strong>会场</strong>和<strong>单位</strong>信息确认您的座位</div>';
  }
  results.forEach(function(p, i) {
    var info = esc(p.venueName);
    var nameHtml = '<div class="multi-name-cn">' + esc(p.name) + '</div>';
    if (p.nameEn) nameHtml += '<div class="multi-name-en">' + esc(p.nameEn) + '</div>';
	    var isBq2 = p.venue && p.venue.layout === 'banquet';
	    var tInfo2 = isBq2 ? findTableForSeat(p.venue, p.row, parseInt(p.seat)) : null;
	    var seatLabel = (isBq2 && tInfo2) ? (esc(p.row) + '<br>第' + tInfo2.tableNum + '桌 ' + tInfo2.seatInTable + '号') : (esc(p.row) + '<br>' + p.seat + '座');
	    if (p.nameEn) {
	      seatLabel = (isBq2 && tInfo2) ? (esc(p.row) + '<br>Table ' + tInfo2.tableNum + ' #' + tInfo2.seatInTable) : (esc(p.row) + '<br>' + p.seat + '座');
	    }
	    html += '<div class="multi-item" onclick="selectPerson(' + i + ')" id="p-' + i + '">' +
      '<div class="left"><div class="avatar">' + esc(p.name.charAt(0)) + '</div>' +
      '<div>' + nameHtml +
      '<div class="sub">' + info + '</div></div></div>' +
      '<div class="badge">' + seatLabel + '</div></div>';
  });
  html += '</div><div id="selectedMap"></div>';
  resultArea.innerHTML = html;
}

function selectPerson(i) {
  var p = currentResults[i];
  document.querySelectorAll('.multi-item').forEach(function(el, j) { el.classList.toggle('active', j === i); });
  document.getElementById('selectedMap').innerHTML = renderPersonCard(p, false, lastSearchIsEn);
}

function renderPersonCard(p, hasDup, isEnSearch) {
  var dupHtml = '';
  if (hasDup) {
    dupHtml = '<div class="dup-notice">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>' +
      '<line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' +
      '存在同名参会者，请根据<strong>会场</strong>和<strong>单位</strong>信息确认您的座位</div>';
  }
  var nameHtml = '<div class="name-cn">' + esc(p.name) + '</div>';
  if (p.nameEn) nameHtml += '<div class="name-en">' + esc(p.nameEn) + '</div>';
  var showEn = p.nameEn || isEnSearch || (p.siteTitleEn && p.siteTitleEn.trim());
  var seatRowHtml = '<div class="value">' + esc(p.row) + '</div>';
  var seatNumHtml = '<div class="value">' + p.seat + ' 号</div>';
  if (showEn) {
    seatRowHtml = '<div class="value">' + esc(p.row) + '</div><div class="value-en">' + esc(translateRow(p.row)) + '</div>';
    seatNumHtml = '<div class="value">' + p.seat + ' 号</div><div class="value-en">Seat ' + p.seat + '</div>';
  }

  // 宴会桌式：解析桌号与桌内座位号，展示4栏（会场 | 排 | 桌 | 座位号）
  var isBanquet = p.venue && p.venue.layout === 'banquet';
  var banquetTableInfo = null;
  if (isBanquet) {
    banquetTableInfo = findTableForSeat(p.venue, p.row, parseInt(p.seat));
  }

  // 判断 p.row 是排还是列（回字型会场可能是列）
  var rowClean = (p.row || '').replace(/\s+/g, '');
  var isCol = /列$/.test(rowClean);
  var venueLbl = showEn ? 'Venue' : '会场';
  var rowLbl = showEn ? (isCol ? 'Col' : 'Row') : (isCol ? '列' : '排');
  var seatLbl = showEn ? 'Seat' : '座位号';

  var seatDetailHtml = '';
  var detailGridStyle = '';
  if (isBanquet && banquetTableInfo) {
    detailGridStyle = ' style="grid-template-columns: 1fr 1fr 1fr 1fr"';
    var tableNumHtml = '<div class="value">第' + banquetTableInfo.tableNum + '桌</div>';
    var seatInTableHtml = '<div class="value">' + banquetTableInfo.seatInTable + ' 号</div>';
    if (showEn) {
      tableNumHtml = '<div class="value">第' + banquetTableInfo.tableNum + '桌</div><div class="value-en">Table ' + banquetTableInfo.tableNum + '</div>';
      seatInTableHtml = '<div class="value">' + banquetTableInfo.seatInTable + ' 号</div><div class="value-en">Seat ' + banquetTableInfo.seatInTable + '</div>';
    }
    var tableLbl = showEn ? 'Table' : '桌';
    seatDetailHtml =
      '<div class="seat-detail-item"><div class="label">' + venueLbl + '</div><div class="value" style="font-size:13px">' + esc(p.venueName) + '</div></div>' +
      '<div class="seat-detail-item"><div class="label">' + rowLbl + '</div>' + seatRowHtml + '</div>' +
      '<div class="seat-detail-item"><div class="label">' + tableLbl + '</div>' + tableNumHtml + '</div>' +
      '<div class="seat-detail-item"><div class="label">' + seatLbl + '</div>' + seatInTableHtml + '</div>';
  } else {
    seatDetailHtml =
      '<div class="seat-detail-item"><div class="label">' + venueLbl + '</div><div class="value" style="font-size:13px">' + esc(p.venueName) + '</div></div>' +
      '<div class="seat-detail-item"><div class="label">' + rowLbl + '</div>' + seatRowHtml + '</div>' +
      '<div class="seat-detail-item"><div class="label">' + seatLbl + '</div>' + seatNumHtml + '</div>';
  }

  return '<div class="result-card">' + dupHtml +
    '<div class="result-header"><div class="result-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>' +
    '<div class="result-info"><h3>' + nameHtml + '</h3></div></div>' +
    '<div class="venue-badge">' + esc(p.venueName) + '</div>' +
    '<div class="seat-detail"' + detailGridStyle + '>' +
    seatDetailHtml + '</div>' +
    (p.venue ? renderSeatMap(p.venue, p, showEn) : '') + '</div>';
}

// 在宴会venue.rows中查找seatNum所属的桌子号和桌内座位号
function findTableForSeat(venue, personRow, seatNum) {
  var rowLabel = (personRow || '').replace(/\s+/g, '');
  if (!venue || !venue.rows) return null;
  for (var ri = 0; ri < venue.rows.length; ri++) {
    var row = venue.rows[ri];
    var rl = (row.label || '').replace(/\s+/g, '');
    if (rl !== rowLabel) continue;
    var groups = row.seatGroups || [];
    var tableNums = row.tableNums || [];
    for (var gi = 0; gi < groups.length; gi++) {
      var group = groups[gi];
      if (group.indexOf(seatNum) >= 0) {
        return {
          tableNum: tableNums[gi] || 0,
          seatInTable: seatNum - group[0] + 1
        };
      }
    }
  }
  return null;
}

function renderSeatMap(venue, person, showEn) {
  var pRow = (person.row || '').replace(/\s+/g, '');
  var pSeat = parseInt(person.seat);

  // U型/回字型会场专用渲染
  if (venue.layout === 'u-shape' || venue.layout === 'hui-shape') {
    return renderUShapeSeatMap(venue, pRow, pSeat, showEn);
  }

  // 自定义布局专用渲染
  if (venue.layout === 'custom' && venue.customRows && venue.customRows.length > 0) {
    return renderCustomSeatMap(venue, pRow, pSeat, showEn);
  }

  // 宴会桌式专用渲染
  if (venue.layout === 'banquet') {
    return renderBanquetSeatMap(venue, pRow, pSeat, showEn);
  }

  // 判断是否为标准模式（与后端 /api/generate-preview 逻辑一致）
  var isStandardMode = venue.layout === 'standard' || venue.mode === 'standard';

  // 根据窗口宽度确定自适应参数
  var containerWidth = Math.min(window.innerWidth - 40, 760);
  var labelWidth = showEn ? 62 : 48;
  var availWidth = containerWidth - labelWidth - 16;
  var gap = 2;
  var aisleWidth = 6;

  if (isStandardMode) {
    // 标准模式：按座位数分组行，只在每组首行显示座位号（与后端一致）
    var maxRowSeats = 0;
    venue.rows.forEach(function(row) {
      if (row.seatGroups) {
        var count = row.seatGroups.reduce(function(s, g) { return s + g.length; }, 0);
        if (count > maxRowSeats) maxRowSeats = count;
      }
    });

    // 将座位数相同的行分组
    var rowGroups = [];
    venue.rows.forEach(function(row) {
      if (row.seatGroups) {
        var seatCount = row.seatGroups.reduce(function(s, g) { return s + g.filter(function(x) { return x !== null && x !== undefined; }).length; }, 0);
        var totalSlots = row.seatGroups.reduce(function(s, g) { return s + g.length; }, 0);
        var prev = rowGroups[rowGroups.length - 1];
        if (prev && prev.seatCount === seatCount && prev.totalSlots === totalSlots) {
          prev.rows.push(row);
        } else {
          rowGroups.push({ seatCount: seatCount, totalSlots: totalSlots, rows: [row] });
        }
      }
    });

    // 计算座位尺寸
    var seatSize = Math.floor((availWidth - (maxRowSeats - 1) * gap) / maxRowSeats);
    seatSize = Math.max(8, Math.min(20, seatSize));
    var fontSize = Math.max(5, Math.min(8, seatSize - 4));

    var sizeStyle = 'width:' + seatSize + 'px;height:' + seatSize + 'px;font-size:' + fontSize + 'px;';
    var gapStyle = 'gap:' + gap + 'px;';
    var labelStyle = 'width:' + labelWidth + 'px;font-size:' + Math.max(8, Math.min(10, seatSize - 2)) + 'px;';
    var rowMargin = Math.max(1, Math.min(3, Math.floor(seatSize / 6)));

    var stageNameCn = venue.stageName || '舞台';
    var stageNameHtml = showEn ? esc(stageNameCn) + '<br><span style="font-size:9px;opacity:0.8;letter-spacing:1px">' + esc(translateStage(stageNameCn)) + '</span>' : esc(stageNameCn);
    var html = '<div class="seat-map-wrap"><div class="seat-map-title">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>' +
      '<rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>' +
      '座位分布图 - 全貌</div>' +
      '<div class="stage" style="line-height:1.25">' + stageNameHtml + '</div><div class="seat-map">';

    rowGroups.forEach(function(group) {
      group.rows.forEach(function(row, ri) {
        var rowLabel = (row.label || '').replace(/\s+/g, '');
        var isFirstRowInGroup = ri === 0;
        var isTargetRow = (rowLabel === pRow);
        var rowLblHtml = showEn ? esc(row.label) + '<br><span style="font-size:' + Math.max(7, Math.min(9, seatSize - 3)) + 'px;color:var(--text2);font-weight:400">' + esc(translateRow(row.label)) + '</span>' : esc(row.label);

        html += '<div class="seat-row" style="' + gapStyle + 'margin-bottom:' + rowMargin + 'px">' +
          '<span class="row-label" style="' + labelStyle + ';white-space:normal;line-height:1.1">' + rowLblHtml + '</span>';

        if (row.seatGroups) {
          row.seatGroups.forEach(function(group, gi) {
            if (gi > 0) {
              html += '<div class="seat-aisle" style="width:' + aisleWidth + 'px;min-width:' + aisleWidth + 'px;"></div>';
            }
            group.forEach(function(seatNum) {
              if (seatNum === null || seatNum === undefined) {
                html += '<div style="' + sizeStyle + '"></div>';
                return;
              }
              var isHit = isTargetRow && parseInt(seatNum) === pSeat;
              // 标准模式：只在每组首行显示座位号
              var showNum = isFirstRowInGroup;
              html += '<div class="seat' + (isHit ? ' highlight' : '') + '" style="' + sizeStyle + '" title="' + esc(row.label) + seatNum + '座">' + (showNum ? seatNum : '') + '</div>';
            });
          });
        }

        html += '</div>';

        // 横向过道
        if (row.hasAisleAfter) {
          html += '<div class="horizontal-aisle" style="height:12px;margin:' + (rowMargin * 2) + 'px 0;display:flex;align-items:center;justify-content:center;">' +
            '<div style="flex:1;height:2px;background:#cbd5e1;border-radius:1px;"></div>' +
            '<span style="padding:0 8px;font-size:8px;color:#94a3b8;font-weight:600;">过道</span>' +
            '<div style="flex:1;height:2px;background:#cbd5e1;border-radius:1px;"></div></div>';
        }
      });
    });

    html += '</div><div class="legend">' +
      '<div class="legend-item"><div class="legend-dot" style="background:#dde3ed"></div>座位</div>' +
      '<div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div>您的座位</div></div></div>';
    return html;
  }

  // 普通/剧院模式：计算最大列数和过道数
  var maxCols = 0;
  var aisleCount = 0;
  venue.rows.forEach(function(row) {
    var cols = 0;
    row.seatGroups.forEach(function(g) { cols += g.length; });
    if (row.seatGroups.length - 1 > aisleCount) aisleCount = row.seatGroups.length - 1;
    if (cols > maxCols) maxCols = cols;
  });

  // 计算座位尺寸
  var seatSize = Math.floor((availWidth - aisleCount * aisleWidth - (maxCols - 1) * gap) / maxCols);
  seatSize = Math.max(8, Math.min(20, seatSize));
  var fontSize = Math.max(5, Math.min(8, seatSize - 4));

  var sizeStyle = 'width:' + seatSize + 'px;height:' + seatSize + 'px;font-size:' + fontSize + 'px;';
  var gapStyle = 'gap:' + gap + 'px;';
  var aisleStyle = 'width:' + aisleWidth + 'px;';
  var labelStyle = 'width:' + labelWidth + 'px;font-size:' + Math.max(8, Math.min(10, seatSize - 2)) + 'px;';
  var rowMargin = Math.max(1, Math.min(3, Math.floor(seatSize / 6)));

  var stageNameCn2 = venue.stageName || '舞台';
  var stageNameHtml2 = showEn ? esc(stageNameCn2) + '<br><span style="font-size:9px;opacity:0.8;letter-spacing:1px">' + esc(translateStage(stageNameCn2)) + '</span>' : esc(stageNameCn2);
  var html = '<div class="seat-map-wrap"><div class="seat-map-title">' +
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>' +
    '<rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>' +
    '座位分布图 - 全貌</div>' +
    '<div class="stage" style="line-height:1.25">' + stageNameHtml2 + '</div><div class="seat-map">';

  venue.rows.forEach(function(row) {
    var rowLabel = (row.label || '').replace(/\s+/g, '');
    var isTargetRow = (rowLabel === pRow);
    var rowLblHtml2 = showEn ? esc(row.label) + '<br><span style="font-size:' + Math.max(7, Math.min(9, seatSize - 3)) + 'px;color:var(--text2);font-weight:400">' + esc(translateRow(row.label)) + '</span>' : esc(row.label);
    html += '<div class="seat-row" style="' + gapStyle + 'margin-bottom:' + rowMargin + 'px">' +
      '<span class="row-label" style="' + labelStyle + ';white-space:normal;line-height:1.1">' + rowLblHtml2 + '</span>';
    row.seatGroups.forEach(function(group, gi) {
      if (gi > 0) html += '<div class="seat-aisle" style="' + aisleStyle + '"></div>';
      group.forEach(function(seatNum) {
        var isHit = isTargetRow && parseInt(seatNum) === pSeat;
        html += '<div class="seat' + (isHit ? ' highlight' : '') + '" style="' + sizeStyle + '" title="' + esc(row.label) + seatNum + '座">' + (isHit ? seatNum : '') + '</div>';
      });
    });
    html += '</div>';
    
    // 如果该行有横向过道标记，添加横向过道
    if (row.hasAisleAfter) {
      html += '<div class="horizontal-aisle" style="height:12px;margin:' + (rowMargin * 2) + 'px 0;display:flex;align-items:center;justify-content:center;">' +
        '<div style="flex:1;height:2px;background:#cbd5e1;border-radius:1px;"></div>' +
        '<span style="padding:0 8px;font-size:8px;color:#94a3b8;font-weight:600;">过道</span>' +
        '<div style="flex:1;height:2px;background:#cbd5e1;border-radius:1px;"></div>' +
        '</div>';
    }
  });

  html += '</div><div class="legend">' +
    '<div class="legend-item"><div class="legend-dot" style="background:#dde3ed"></div>座位</div>' +
    '<div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div>您的座位</div></div></div>';
  return html;
}

// 宴会桌式会场全貌图：每桌独立显示，上3座 + 桌子 + 下3座，紧凑适配手机
function renderBanquetSeatMap(venue, pRow, pSeat, showEn) {
  if (!venue.rows || venue.rows.length === 0) {
    return '<div class="seat-map-wrap"><div class="seat-map-title">座位分布图 - 全貌</div><div style="text-align:center;color:var(--text2);padding:20px">暂无会场布局数据</div></div>';
  }

  var containerWidth = Math.min(window.innerWidth - 40, 760);
  var labelWidth = 36;

  // 找最大桌子数
  var maxTablesInRow = 1;
  venue.rows.forEach(function(row) {
    if (row.seatGroups && row.seatGroups.length > maxTablesInRow) {
      maxTablesInRow = row.seatGroups.length;
    }
  });

  // 紧凑尺寸：每个座位小方块，桌子横条
  var seatSz = Math.min(18, Math.floor((containerWidth - labelWidth - 20 - maxTablesInRow * 4) / (maxTablesInRow * 3)));
  seatSz = Math.max(10, seatSz);
  var tableW = seatSz * 3 + 6;
  var tableH = Math.max(8, Math.floor(seatSz * 0.5));
  var gap = Math.max(3, Math.floor(seatSz * 0.4));
  var fsize = Math.max(6, Math.min(9, seatSz - 2));
  var rowGap = Math.max(8, Math.floor(seatSz * 0.8));

  var html = '<div class="seat-map-wrap"><div class="seat-map-title">' +
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>' +
    '<rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>' +
    '座位分布图 - 全貌</div>' +
    '<div class="stage" style="line-height:1.25">' + (showEn ? esc(venue.stageName || '舞台') + '<br><span style="font-size:9px;opacity:0.8;letter-spacing:1px">' + esc(translateStage(venue.stageName || '舞台')) + '</span>' : esc(venue.stageName || '舞台')) + '</div>' +
    '<div class="seat-map" style="padding:8px 0">';

  venue.rows.forEach(function(row) {
    var groups = row.seatGroups || [];
    if (groups.length === 0) return;

    var rowLabel = (row.label || '').replace(/\s+/g, '');
    var isTargetRow = (rowLabel === pRow);

    // 行标签 + 桌子行
    var rowLblHtml = showEn ? esc(row.label) + '<br><span style="font-size:8px;color:var(--text2);font-weight:400;">' + esc(translateRow(row.label)) + '</span>' : esc(row.label);
    html += '<div style="display:flex;align-items:center;justify-content:center;margin-bottom:' + rowGap + 'px">';
    html += '<div style="width:' + labelWidth + 'px;font-size:10px;font-weight:700;color:#ef4444;text-align:right;padding-right:4px;flex-shrink:0;line-height:1.1;">' + rowLblHtml + '</div>';
    html += '<div style="display:flex;align-items:flex-start;gap:' + gap + 'px">';

    groups.forEach(function(group, gi) {
      if (!group || group.length === 0) return;
      var tableNum = (row.tableNums || [])[gi] || 0;

      html += '<div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0">';
      // 上排座位 (0,1,2)
      html += '<div style="display:flex;gap:1px">';
      for (var si = 0; si < 3 && si < group.length; si++) {
        var seatNum = group[si];
        var isHit = isTargetRow && seatNum === pSeat;
        html += '<div class="seat' + (isHit ? ' highlight' : '') + '" style="width:' + seatSz + 'px;height:' + seatSz + 'px;font-size:' + fsize + 'px" title="' + esc(rowLabel) + '桌' + tableNum + ' ' + (si + 1) + '号座">' + (isHit ? (si + 1) : '') + '</div>';
      }
      html += '</div>';
      // 桌子
      html += '<div style="width:' + tableW + 'px;height:' + tableH + 'px;background:#fef3c7;border:1.5px solid #f59e0b;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:' + Math.max(6, fsize - 1) + 'px;font-weight:700;color:#92400e;margin:' + Math.max(2, Math.floor(tableH * 0.3)) + 'px 0">桌' + tableNum + '</div>';
      // 下排座位 (3,4,5)
      html += '<div style="display:flex;gap:1px">';
      for (var si = 3; si < 6 && si < group.length; si++) {
        var seatNum = group[si];
        var isHit = isTargetRow && seatNum === pSeat;
        html += '<div class="seat' + (isHit ? ' highlight' : '') + '" style="width:' + seatSz + 'px;height:' + seatSz + 'px;font-size:' + fsize + 'px" title="' + esc(rowLabel) + '桌' + tableNum + ' ' + (si + 1) + '号座">' + (isHit ? (si + 1) : '') + '</div>';
      }
      html += '</div>';
      html += '</div>';
    });

    html += '</div>';
    html += '<div style="width:' + labelWidth + 'px;font-size:10px;font-weight:700;color:#ef4444;text-align:left;padding-left:4px;flex-shrink:0">' + esc(row.label) + '</div>';
    html += '</div>';

    if (row.hasAisleAfter) {
      html += '<div style="height:10px;display:flex;align-items:center;justify-content:center;margin:' + Math.floor(rowGap / 2) + 'px 0"><div style="flex:1;height:1.5px;background:#cbd5e1;border-radius:1px"></div><span style="padding:0 6px;font-size:7px;color:#94a3b8">过道</span><div style="flex:1;height:1.5px;background:#cbd5e1;border-radius:1px"></div></div>';

  return html;
}

function renderUShapeSeatMap(venue, pRow, pSeat, showEn) {
  // 位置结构法：以/^第.+列$/为锚点分拆行（顶部 | 臂列 | 底部）
  var firstArm = -1, lastArm = -1;
  venue.rows.forEach(function(r, idx) {
    var l = (r.label || '').replace(/\s+/g, '');
    if (/^第.+列$/.test(l)) { if (firstArm < 0) firstArm = idx; lastArm = idx; }
  });
  var topRows = firstArm > 0 ? venue.rows.slice(0, firstArm) : [];
  var armRows = venue.rows.slice(Math.max(0, firstArm), lastArm + 1);
  var bottomRows = lastArm >= 0 && lastArm < venue.rows.length - 1 ? venue.rows.slice(lastArm + 1) : [];
  var midIdx = Math.floor(armRows.length / 2);
  var leftRows = armRows.slice(0, midIdx);
  var rightRows = armRows.slice(midIdx);

  // 计算最大座位数
  var maxArmSeats = 0;
  armRows.forEach(function(row) {
    if (row.seatGroups[0]) maxArmSeats = Math.max(maxArmSeats, row.seatGroups[0].length);
  });
  var maxTopSeats = 0;
  topRows.forEach(function(r) { if (r.seatGroups[0]) maxTopSeats = Math.max(maxTopSeats, r.seatGroups[0].length); });
  var maxBottomSeats = 0;
  bottomRows.forEach(function(r) { if (r.seatGroups[0]) maxBottomSeats = Math.max(maxBottomSeats, r.seatGroups[0].length); });
  var hMaxSeats = Math.max(maxTopSeats, maxBottomSeats);

  // 移动端优先：卡片可用宽度约 280-335px（屏幕375-40外边距-40卡片padding）
  var cardMaxW = Math.min(window.innerWidth - 80, 680);
  // 列标签宽度（紧凑但可读）
  var lblW = 20;
  // 臂列之间的间距
  var colGap = 1;
  // 左右臂之间的最小间距
  var midGap = 8;
  // 座位间隙
  var sGap = 1;
  // 座位尺寸：优先保证竖直方向不超出可视范围
  var maxVertH = Math.min(500, window.innerHeight * 0.7);
  var seatFromVert = Math.floor((maxVertH - (maxArmSeats - 1) * sGap) / Math.max(maxArmSeats, 1));
  var seatMaxH = Math.min(28, Math.max(9, seatFromVert));
  // 水平方向也做约束
  var totalArmCols = leftRows.length + rightRows.length;
  var hArmSpace = cardMaxW - midGap - totalArmCols * lblW - (totalArmCols - 1) * colGap;
  var seatFromHoriz = totalArmCols > 0 ? Math.floor(hArmSpace / totalArmCols) : 30;
  var seatMaxW = Math.min(30, Math.max(9, seatFromHoriz));
  // 取较小的保证正方形
  var seatSize = Math.max(8, Math.min(seatMaxH, seatMaxW));
  var fontSize = Math.max(5, Math.min(8, seatSize - 2));
  var sStyle = 'width:' + seatSize + 'px;height:' + seatSize + 'px;font-size:' + fontSize + 'px;';
  // 行标签字号
  var lblFont = Math.max(7, Math.min(11, seatSize));

  // 水平行标签预留宽度（左侧排号，按最长标签估算）
  var hLabelExtra = Math.max(48, Math.ceil(lblFont * 5.5));
  // 水平行（顶部/底部）需要的总宽度（含标签）
  var hRowWidth = hMaxSeats > 0 ? hMaxSeats * (seatSize + sGap) - sGap + hLabelExtra : 0;
  // 左右臂实际宽度
  var leftW = leftRows.length > 0 ? leftRows.length * lblW + (leftRows.length - 1) * colGap + seatSize : 0;
  var rightW = rightRows.length > 0 ? rightRows.length * lblW + (rightRows.length - 1) * colGap + seatSize : 0;
  // 总宽度（取水平行和臂列中较宽者）
  var totalW = Math.max(hRowWidth, leftW + midGap + rightW);

  // 缩放适配：只缩不放（座位尺寸已最大化），保证不超出卡片
  var scale = Math.min(1, cardMaxW / Math.max(totalW, 1));
  var scaledW = Math.round(totalW * scale);

  var html = '<div class="seat-map-wrap"><div class="seat-map-title">' +
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>' +
    '<rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>' +
    '座位分布图 - 全貌</div>' +
    '<div class="stage" style="margin-bottom:6px;padding:4px 8px;font-size:10px;letter-spacing:2px;min-width:auto;line-height:1.25">' + (showEn ? esc(venue.stageName || '投屏区') + '<br><span style="font-size:8px;opacity:0.8;letter-spacing:1px">' + esc(translateStage(venue.stageName || '投屏区')) + '</span>' : esc(venue.stageName || '投屏区')) + '</div>' +
    '<div class="seat-map" style="text-align:center;">' +
    '<div style="display:inline-block;width:' + scaledW + 'px;overflow:hidden;vertical-align:top;">' +
    '<div style="transform:scale(' + scale + ');transform-origin:top left;width:' + totalW + 'px;">';

  // ---- 顶部行（回字型顶部封闭）----
  if (topRows.length > 0) {
    topRows.forEach(function(topRow) {
      var topLabel = (topRow.label || '').replace(/\s+/g, '');
      var seats = topRow.seatGroups[0] || [];
      var topLabelHtml = showEn ? esc(topRow.label) + '<br><span style="font-size:' + (lblFont-1) + 'px;color:var(--text2);font-weight:400;">' + esc(translateRow(topRow.label)) + '</span>' : esc(topRow.label);
      html += '<div style="display:flex;align-items:center;justify-content:center;margin-bottom:3px;">' +
        '<span style="font-size:' + lblFont + 'px;color:var(--text2);font-weight:600;margin-right:4px;white-space:nowrap;min-width:40px;text-align:right;line-height:1.1;">' + topLabelHtml + '</span>';
      seats.forEach(function(sn) {
        var isHit = topLabel === pRow && parseInt(sn) === pSeat;
        html += '<div class="seat' + (isHit ? ' highlight' : '') + '" style="' + sStyle + 'margin-right:' + sGap + 'px;" title="' + esc(topRow.label) + sn + '号">' + (isHit ? sn : '') + '</div>';
      });
      html += '</div>';
    });
  }

  // ---- 臂列：左臂 + 中间 + 右臂 ----
  html += '<div style="display:flex;align-items:flex-start;justify-content:center;">';

  // 左臂
  if (leftRows.length > 0) {
    html += '<div style="display:flex;gap:' + colGap + 'px;">';
    leftRows.forEach(function(leftRow) {
      var leftLabel = (leftRow.label || '').replace(/\s+/g, '');
      var seats = leftRow.seatGroups[0] || [];
      var leftLblHtml = showEn ? esc(leftRow.label) + '<br><span style="font-size:' + (lblFont-1) + 'px;color:var(--text2);font-weight:400;">' + esc(translateRow(leftRow.label)) + '</span>' : esc(leftRow.label);
      html += '<div style="display:flex;flex-direction:column;align-items:center;">' +
        '<div style="font-size:' + lblFont + 'px;color:#ef4444;font-weight:700;margin-bottom:2px;white-space:nowrap;min-width:' + lblW + 'px;text-align:center;line-height:1.1;">' + leftLblHtml + '</div>';
      seats.forEach(function(sn) {
        var isHit = leftLabel === pRow && parseInt(sn) === pSeat;
        html += '<div class="seat' + (isHit ? ' highlight' : '') + '" style="' + sStyle + 'margin-bottom:' + sGap + 'px;" title="' + esc(leftRow.label) + sn + '号">' + (isHit ? sn : '') + '</div>';
      });
      html += '</div>';
    });
    html += '</div>';
  }

  // 中间空白
  html += '<div style="width:' + midGap + 'px;flex-shrink:0;"></div>';

  // 右臂
  if (rightRows.length > 0) {
    html += '<div style="display:flex;gap:' + colGap + 'px;">';
    rightRows.forEach(function(rightRow) {
      var rightLabel = (rightRow.label || '').replace(/\s+/g, '');
      var seats = rightRow.seatGroups[0] || [];
      var rightLblHtml = showEn ? esc(rightRow.label) + '<br><span style="font-size:' + (lblFont-1) + 'px;color:var(--text2);font-weight:400;">' + esc(translateRow(rightRow.label)) + '</span>' : esc(rightRow.label);
      html += '<div style="display:flex;flex-direction:column;align-items:center;">' +
        '<div style="font-size:' + lblFont + 'px;color:#ef4444;font-weight:700;margin-bottom:2px;white-space:nowrap;min-width:' + lblW + 'px;text-align:center;line-height:1.1;">' + rightLblHtml + '</div>';
      seats.forEach(function(sn) {
        var isHit = rightLabel === pRow && parseInt(sn) === pSeat;
        html += '<div class="seat' + (isHit ? ' highlight' : '') + '" style="' + sStyle + 'margin-bottom:' + sGap + 'px;" title="' + esc(rightRow.label) + sn + '号">' + (isHit ? sn : '') + '</div>';
      });
      html += '</div>';
    });
    html += '</div>';
  }

  html += '</div>';

  // ---- 底部行 ----
  if (bottomRows.length > 0) {
    bottomRows.forEach(function(botRow) {
      var bottomLabel = (botRow.label || '').replace(/\s+/g, '');
      var seats = botRow.seatGroups[0] || [];
      var botLblHtml = showEn ? esc(botRow.label) + '<br><span style="font-size:' + (lblFont-1) + 'px;color:var(--text2);font-weight:400;">' + esc(translateRow(botRow.label)) + '</span>' : esc(botRow.label);
      html += '<div style="display:flex;align-items:center;justify-content:center;margin-top:3px;">' +
        '<span style="font-size:' + lblFont + 'px;color:var(--text2);font-weight:600;margin-right:4px;white-space:nowrap;min-width:44px;text-align:right;line-height:1.1;">' + botLblHtml + '</span>';
      seats.forEach(function(sn) {
        var isHit = bottomLabel === pRow && parseInt(sn) === pSeat;
        html += '<div class="seat' + (isHit ? ' highlight' : '') + '" style="' + sStyle + 'margin-right:' + sGap + 'px;" title="' + esc(botRow.label) + sn + '号">' + (isHit ? sn : '') + '</div>';
      });
      html += '</div>';
    });
  }

  html += '</div></div></div><div class="legend">' +
    '<div class="legend-item"><div class="legend-dot" style="background:#dde3ed"></div>座位</div>' +
    '<div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div>您的座位</div></div></div>';
  return html;
}

// 自定义布局座位图渲染（显示大门、LED屏等会场布置）
function renderCustomSeatMap(venue, pRow, pSeat, showEn) {
  var cr = venue.customRows;
  if (!cr || cr.length === 0) {
    return '<div class="seat-map-wrap"><div class="seat-map-title">座位分布图 - 全貌</div><div style="text-align:center;color:var(--text2);padding:20px">暂无会场布局数据</div></div>';
  }

  var canvasW = venue.canvasWidth || 800;
  var canvasH = venue.canvasHeight || 600;

  // 计算最密集排的每座像素数
  var minSeatPx = Infinity;
  cr.forEach(function(row) {
    var size = row.direction === 'horizontal'
      ? (row.width || 100) / Math.max(row.seatCount, 1)
      : (row.height || 50) / Math.max(row.seatCount, 1);
    minSeatPx = Math.min(minSeatPx, size);
  });

  // 目标每座至少16px（查询页只需显示，不需拖拽）
  var MIN_SEAT_PX = 16;
  var scale = Math.max(1, MIN_SEAT_PX / Math.max(minSeatPx, 0.5));
  scale = Math.min(scale, 6);

  var containerW = Math.round(canvasW * scale);
  var containerH = Math.round(canvasH * scale);

  // 计算可用宽度（预留卡片内边距），超出时用 CSS transform 缩放
  var maxWidth = Math.max(240, Math.min(window.innerWidth - 80, 720));
  var cssScale = Math.min(1, maxWidth / containerW);
  var outerW = Math.round(containerW * cssScale);
  var outerH = Math.round(containerH * cssScale);

  var html = '<div class="seat-map-wrap"><div class="seat-map-title">' +
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>' +
    '<rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>' +
    '座位分布图 - 全貌</div>' +
    '<div style="position:relative;width:' + outerW + 'px;height:' + outerH + 'px;overflow:hidden">' +
    '<div style="position:absolute;top:0;left:0;transform:scale(' + cssScale + ');transform-origin:0 0;width:' + containerW + 'px;height:' + containerH + 'px">';

  // 渲染舞台（LED屏等）
  if (venue.customStage) {
    var st = venue.customStage;
    var stX = Math.round((st.x || 0) * scale);
    var stY = Math.round((st.y || 0) * scale);
    var stW = Math.round((st.width || 100) * scale);
    var stH = Math.round((st.height || 80) * scale);
    var stFontSize = Math.max(9, Math.min(13, stH / 5));
    var stLabelCn = st.label || '舞台';
    var stLabelHtml = showEn ? esc(stLabelCn) + '<br><span style="font-size:' + Math.max(7, stFontSize - 2) + 'px;opacity:0.85;font-weight:500">' + esc(translateStage(stLabelCn)) + '</span>' : esc(stLabelCn);
    html += '<div style="position:absolute;left:' + stX + 'px;top:' + stY + 'px;width:' + stW + 'px;height:' + stH + 'px;background:linear-gradient(135deg,#f59e0b,#d97706);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:' + stFontSize + 'px;font-weight:700;z-index:1;box-shadow:0 2px 6px rgba(0,0,0,0.15);line-height:1.2">' + stLabelHtml + '</div>';
  }

  // 渲染大门
  if (venue.customGates && venue.customGates.length > 0) {
    venue.customGates.forEach(function(gate) {
      var gX = Math.round((gate.x || 0) * scale);
      var gY = Math.round((gate.y || 0) * scale);
      var gW = Math.round((gate.width || 80) * scale);
      var gH = Math.round((gate.height || 120) * scale);
      var gFontSize = Math.max(8, Math.min(11, gH / 6));
      html += '<div style="position:absolute;left:' + gX + 'px;top:' + gY + 'px;width:' + gW + 'px;height:' + gH + 'px;background:linear-gradient(135deg,#10b981,#059669);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:' + gFontSize + 'px;font-weight:700;z-index:1;box-shadow:0 2px 6px rgba(0,0,0,0.15)">' + esc(gate.label || '门') + '</div>';
    });
  }

  // 渲染座位排
  var sorted = cr.slice().sort(function(a, b) { return (a.rowNum || 0) - (b.rowNum || 0); });
  sorted.forEach(function(row) {
    var rx = Math.round((row.x || 0) * scale);
    var ry = Math.round((row.y || 0) * scale);
    var rw = Math.round((row.width || 100) * scale);
    var rh = Math.round((row.height || 50) * scale);
    var seatCount = row.seatCount || 0;
    var rowLabel = (row.label || '').replace(/\s+/g, '');
    var isTargetRow = (rowLabel === pRow);

    if (row.direction === 'horizontal') {
      var seatW = Math.max(14, Math.floor(rw / seatCount));
      // 行标签
      var labelLeft = Math.max(0, rx - 46);
      html += '<div style="position:absolute;left:' + labelLeft + 'px;top:' + ry + 'px;width:42px;height:' + rh + 'px;display:flex;align-items:center;justify-content:flex-end;font-size:9px;color:#ef4444;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="' + esc(row.label) + '">' + esc(row.label) + '</div>';
      // 座位
      for (var i = 0; i < seatCount; i++) {
        var sx = rx + i * seatW;
        var sn = i + 1;
        var isHit = isTargetRow && sn === pSeat;
        var seatW2 = Math.max(seatW - 2, 12);
        html += '<div class="seat' + (isHit ? ' highlight' : '') + '" style="position:absolute;left:' + sx + 'px;top:' + ry + 'px;width:' + seatW2 + 'px;height:' + rh + 'px;border-radius:3px 3px 5px 5px;display:flex;align-items:center;justify-content:center;font-size:' + Math.max(6, Math.min(10, seatW2 * 0.45)) + 'px;font-weight:600" title="' + esc(row.label) + sn + '号">' + (isHit ? sn : '') + '</div>';
      }
    } else {
      // 竖列座位
      var seatH = Math.max(14, Math.floor(rh / seatCount));
      // 行标签（上方）
      var labelTop = Math.max(0, ry - 15);
      html += '<div style="position:absolute;left:' + rx + 'px;top:' + labelTop + 'px;width:' + rw + 'px;height:14px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#ef4444;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="' + esc(row.label) + '">' + esc(row.label) + '</div>';
      for (var i = 0; i < seatCount; i++) {
        var sy = ry + i * seatH;
        var sn = i + 1;
        var isHit = isTargetRow && sn === pSeat;
        var seatH2 = Math.max(seatH - 2, 12);
        html += '<div class="seat' + (isHit ? ' highlight' : '') + '" style="position:absolute;left:' + rx + 'px;top:' + sy + 'px;width:' + rw + 'px;height:' + seatH2 + 'px;border-radius:3px 3px 5px 5px;display:flex;align-items:center;justify-content:center;font-size:' + Math.max(6, Math.min(10, rw * 0.45)) + 'px;font-weight:600" title="' + esc(row.label) + sn + '号">' + (isHit ? sn : '') + '</div>';
      }
    }
  });

  html += '</div></div>' +
    '<div class="legend">' +
    '<div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div>舞台/LED</div>' +
    '<div class="legend-item"><div class="legend-dot" style="background:#10b981"></div>大门</div>' +
    '<div class="legend-item"><div class="legend-dot" style="background:#dde3ed"></div>座位</div>' +
    '<div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div>您的座位</div>' +
    '</div></div>';
  return html;
}

// 中文数字转阿拉伯数字（支持 一～九十九）
function parseCnNum(s) {
  if (/^\d+$/.test(s)) return parseInt(s);
  var map = { '一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10 };
  if (map[s]) return map[s];
  // 十X → 10+X (十一→11)
  var m10 = s.match(/^十([一二三四五六七八九])$/);
  if (m10) return 10 + map[m10[1]];
  // X十 → X*10 (二十→20)
  var m20 = s.match(/^([二三四五六七八九])十$/);
  if (m20) return map[m20[1]] * 10;
  // X十Y → X*10+Y (二十五→25)
  var m21 = s.match(/^([二三四五六七八九])十([一二三四五六七八九])$/);
  if (m21) return map[m21[1]] * 10 + map[m21[2]];
  return s;
}

function translateStage(stageName) {
  if (!stageName) return '';
  var s = stageName.trim();
  var map = { '舞台区域':'Stage', '投屏区':'Screen', '舞台':'Stage', '主席台':'Rostrum', 'LED屏':'LED Screen' };
  return map[s] || s;
}
function translateRow(rowLabel) {
  if (!rowLabel) return '';
  var s = rowLabel.trim().replace(/\s+/g, '');
  // 方向前缀: 前/后/左/右/内前/内后 + 第X排/列
  var dirMap = { '前':'Front','后':'Back','左':'Left','右':'Right','内前':'Inner Front','内后':'Inner Back' };
  var dirMatch = s.match(/^(前|后|左|右|内前|内后)第([一二三四五六七八九十]+|\d+)([排列])$/);
  if (dirMatch) {
    var d = dirMap[dirMatch[1]];
    var dn = dirMatch[2];
    var dnum = parseCnNum(dn);
    var dtype = dirMatch[3] === '列' ? 'Col' : 'Row';
    return d + ' ' + dtype + ' ' + dnum;
  }
  // 方向前缀无"第": 前X排/列
  var dirMatch2 = s.match(/^(前|后|左|右|内前|内后)(\d+|[一二三四五六七八九十]+)([排列])$/);
  if (dirMatch2) {
    var d2 = dirMap[dirMatch2[1]];
    var dn2 = dirMatch2[2];
    var dnum2 = parseCnNum(dn2);
    var dtype2 = dirMatch2[3] === '列' ? 'Col' : 'Row';
    return d2 + ' ' + dtype2 + ' ' + dnum2;
  }
  // 一楼沙发第一排、一楼第X排、二楼第X排 等
  var floorSofaMatch = s.match(/^(一楼|二楼|三楼|四楼|五楼|六楼|七楼|八楼|九楼|十楼)沙发[第]?([一二三四五六七八九十]+|\d+)[排]$/);
  if (floorSofaMatch) {
    var floorMap = { '一楼':'1F','二楼':'2F','三楼':'3F','四楼':'4F','五楼':'5F','六楼':'6F','七楼':'7F','八楼':'8F','九楼':'9F','十楼':'10F' };
    var n = floorSofaMatch[2];
    var num = parseCnNum(n);
    return floorMap[floorSofaMatch[1]] + ' Row ' + num + ' (Sofa)';
  }
  // 一楼第X排、二楼第X排
  var floorMatch = s.match(/^(一楼|二楼|三楼|四楼|五楼|六楼|七楼|八楼|九楼|十楼)第([一二三四五六七八九十]+|\d+)[排]$/);
  if (floorMatch) {
    var floorMap2 = { '一楼':'1F','二楼':'2F','三楼':'3F','四楼':'4F','五楼':'5F','六楼':'6F','七楼':'7F','八楼':'8F','九楼':'9F','十楼':'10F' };
    var n2 = floorMatch[2];
    var num2 = parseCnNum(n2);
    return floorMap2[floorMatch[1]] + ' Row ' + num2;
  }
  // 沙发第一排、沙发第二排 → Row 1 (Sofa)
  var sofaMatch = s.match(/^沙发[第]?([一二三四五六七八九十]+|\d+)[排]$/);
  if (sofaMatch) {
    var n3 = sofaMatch[1];
    var num3 = parseCnNum(n3);
    return 'Row ' + num3 + ' (Sofa)';
  }
  // 第X排 → Row X
  var rowMatch = s.match(/^第([一二三四五六七八九十]+|\d+)[排]$/);
  if (rowMatch) {
    var n4 = rowMatch[1];
    var num4 = parseCnNum(n4);
    return 'Row ' + num4;
  }
  // 第X列 → Column X
  var colMatch = s.match(/^第([一二三四五六七八九十]+|\d+)[列]$/);
  if (colMatch) {
    var n5 = colMatch[1];
    var num5 = parseCnNum(n5);
    return 'Column ' + num5;
  }
  // X排（无第前缀）→ Row X
  var rowMatch2 = s.match(/^(\d+|[一二三四五六七八九十]+)[排]$/);
  if (rowMatch2) {
    var n6 = rowMatch2[1];
    var num6 = parseCnNum(n6);
    return 'Row ' + num6;
  }
  // X列（无第前缀）→ Column X
  var colMatch2 = s.match(/^(\d+|[一二三四五六七八九十]+)[列]$/);
  if (colMatch2) {
    var n7 = colMatch2[1];
    var num7 = parseCnNum(n7);
    return 'Column ' + num7;
  }
  return rowLabel;
}

function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
</script>
