[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx-out.log
stderr_logfile=/var/log/supervisor/nginx-err.log
priority=10

[program:node]
command=node /app/server.js
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/node-out.log
stderr_logfile=/var/log/supervisor/node-err.log
priority=20
environment=PORT="3000",NODE_ENV="production"

[program:streamlit]
command=streamlit run /app/app.py --server.port 8505 --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection true --browser.gatherUsageStats false
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/streamlit-out.log
stderr_logfile=/var/log/supervisor/streamlit-err.log
priority=30
